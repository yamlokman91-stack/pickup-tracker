<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickup Tracker</title>
<style>
body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;margin:0}#map{height:70vh;width:100%}.panel{padding:12px 16px}.status{font-size:14px;color:#555;margin-bottom:8px}button{width:100%;padding:14px;font-size:16px;border:0;border-radius:8px;background:#1a73e8;color:#fff;margin-top:8px}#passwordScreen{position:fixed;inset:0;background:#fff;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}#passwordBox{width:100%;max-width:320px;text-align:center}#passwordBox h1{font-size:21px}#passwordInput{width:100%;box-sizing:border-box;padding:14px;font-size:18px;text-align:center;border:1px solid #ccc;border-radius:8px;margin:12px 0}#passwordError{color:#d93025;min-height:20px;font-size:14px}#roleScreen{position:fixed;inset:0;background:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}.role-btn{width:100%;max-width:320px;padding:20px;font-size:18px;margin-bottom:16px;border-radius:12px;border:0;background:#1a73e8;color:#fff}.role-btn.passenger{background:#34a853}#roomBadge{position:fixed;top:12px;right:12px;z-index:40;background:#fff;border:1px solid #ddd;border-radius:20px;padding:8px 14px;font-size:14px;box-shadow:0 1px 4px #0003;cursor:pointer}#roomModal{position:fixed;inset:0;background:#0006;z-index:60;display:none;align-items:center;justify-content:center}#roomModal .box{background:#fff;border-radius:12px;padding:20px;width:280px}#roomModal input{width:100%;padding:10px;font-size:16px;margin:10px 0;box-sizing:border-box}.row{display:flex;gap:8px}.row button{flex:1}.badge{display:inline-block;padding:2px 8px;border-radius:12px;background:#eee;font-size:12px}
</style>
</head>
<body>
<div id="passwordScreen"><div id="passwordBox"><h1>接送即時導航</h1><p>請輸入密碼先可以使用</p><input id="passwordInput" type="password" inputmode="numeric" maxlength="4" placeholder="輸入 4 位數密碼"><div id="passwordError"></div><button id="passwordBtn">進入 App</button></div></div>
<div id="roleScreen"><h1>你想用邊個身份？</h1><button class="role-btn" id="btnDriver">🚗 我係司機</button><button class="role-btn passenger" id="btnPassenger">🧍 我係乘客</button><small>預設房號：0001</small></div>
<div id="roomBadge" style="display:none">房號 <span id="roomLabel">0001</span> ▾</div>
<div id="roomModal"><div class="box"><b>轉房 / 開新房</b><input id="roomInput" placeholder="例如 0002"><div class="row"><button id="joinRoomBtn">確認轉房</button><button id="newRoomBtn" style="background:#f9ab00">開新房</button></div><button id="closeModalBtn" style="background:#eee;color:#333">取消</button></div></div>
<div id="map"></div><div class="panel"><div class="status" id="statusLine">請先輸入密碼…</div><div id="passengerControls" style="display:none"><button id="arriveBtn">📍 已到達等候點</button></div></div>
<script>
const APP_PASSWORD="0813";
const FIREBASE_CONFIG={apiKey:"AIzaSyAeeZza00rqU7rMhCS2rDxgDDDKbRdR144",authDomain:"pickup-tracker-5032f.firebaseapp.com",databaseURL:"https://pickup-tracker-5032f-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"pickup-tracker-5032f",storageBucket:"pickup-tracker-5032f.firebasestorage.app",messagingSenderId:"116867625005",appId:"1:116867625005:web:471c15c1913d1dce8688a4"};
const GOOGLE_MAPS_API_KEY="AIzaSyAyMo3Bbf0Rg5EYkTUQ539V_cbNUO_FFcg";
const MOVE_THRESHOLD_METERS=10,DEFAULT_ROOM="0001";
let role=null,rideId=localStorage.getItem("rideId")||DEFAULT_ROOM,map,dbRef,firebaseReady=false,mapsReady=false,driverPos=null,lastUploaded=null,arrived=false,directionsService,directionsRenderer;
const statusLine=document.getElementById("statusLine");
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement("script");s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
function distanceMeters(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),x=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function bindRoomRef(){if(dbRef)dbRef.off();dbRef=firebase.database().ref(`rides/${rideId}/passengerLocation`);lastUploaded=null;arrived=false;document.getElementById("roomLabel").textContent=rideId;localStorage.setItem("rideId",rideId);if(role==="driver")listenAsDriver()}
async function startApp(r){role=r;document.getElementById("roleScreen").style.display="none";document.getElementById("roomBadge").style.display="block";if(!firebaseReady){await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js");await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js");firebase.initializeApp(FIREBASE_CONFIG);firebaseReady=true}if(!mapsReady){await loadScript(`https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}`);map=new google.maps.Map(document.getElementById("map"),{center:{lat:22.3193,lng:114.1694},zoom:14});directionsService=new google.maps.DirectionsService();directionsRenderer=new google.maps.DirectionsRenderer({map});mapsReady=true}bindRoomRef();if(role==="passenger")initPassenger();else{statusLine.textContent="司機模式：等待乘客位置更新…";navigator.geolocation.watchPosition(p=>driverPos={lat:p.coords.latitude,lng:p.coords.longitude},e=>statusLine.textContent="司機定位失敗："+e.message,{enableHighAccuracy:true})}}
function initPassenger(){document.getElementById("passengerControls").style.display="block";statusLine.textContent="乘客模式：正在追蹤你嘅位置…";const marker=new google.maps.Marker({map,label:"你"});navigator.geolocation.watchPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;map.setCenter({lat,lng});marker.setPosition({lat,lng});maybeUpload(lat,lng,false)},e=>statusLine.textContent="定位失敗："+e.message,{enableHighAccuracy:true,maximumAge:3000})}
function maybeUpload(lat,lng,force){const moved=lastUploaded?distanceMeters(lastUploaded.lat,lastUploaded.lng,lat,lng):Infinity;if(moved>=MOVE_THRESHOLD_METERS||force){lastUploaded={lat,lng};dbRef.set({lat,lng,arrived:force||arrived,updatedAt:Date.now()});statusLine.textContent=force?"✅ 已通知司機：你到咗等候點":`已更新位置（移動咗 ${moved.toFixed(1)} 米）`}}
function listenAsDriver(){dbRef.on("value",s=>{const d=s.val();if(!d||!driverPos)return;statusLine.innerHTML=`<span class="badge">${d.arrived?"🔴 乘客已到達等候點":"🟡 乘客移動緊"}</span> 房號 ${rideId}`;directionsService.route({origin:driverPos,destination:{lat:d.lat,lng:d.lng},travelMode:google.maps.TravelMode.DRIVING},(result,status)=>{if(status==="OK")directionsRenderer.setDirections(result);else statusLine.textContent+=`（路線計算失敗: ${status}）`})})}
function unlock(){document.getElementById("passwordScreen").style.display="none";document.getElementById("roleScreen").style.display="flex";document.getElementById("passwordInput").value=""}
function checkPassword(){const input=document.getElementById("passwordInput").value;if(input===APP_PASSWORD){sessionStorage.setItem("pickupUnlocked","1");unlock()}else{document.getElementById("passwordError").textContent="密碼不正確，請再試一次";document.getElementById("passwordInput").select()}}
if(sessionStorage.getItem("pickupUnlocked")==="1")unlock();document.getElementById("passwordBtn").onclick=checkPassword;document.getElementById("passwordInput").addEventListener("keydown",e=>{if(e.key==="Enter")checkPassword()});
document.getElementById("btnDriver").onclick=()=>startApp("driver");document.getElementById("btnPassenger").onclick=()=>startApp("passenger");document.getElementById("arriveBtn").onclick=()=>{arrived=true;navigator.geolocation.getCurrentPosition(p=>maybeUpload(p.coords.latitude,p.coords.longitude,true))};
const modal=document.getElementById("roomModal");document.getElementById("roomBadge").onclick=()=>{document.getElementById("roomInput").value=rideId;modal.style.display="flex"};document.getElementById("closeModalBtn").onclick=()=>modal.style.display="none";document.getElementById("joinRoomBtn").onclick=()=>{rideId=document.getElementById("roomInput").value.trim()||DEFAULT_ROOM;bindRoomRef();modal.style.display="none"};document.getElementById("newRoomBtn").onclick=()=>{rideId=String(Math.floor(1000+Math.random()*9000));bindRoomRef();modal.style.display="none"};
</script>
</body>
</html>
