<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>接送導航</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif;color:#202124}#map{height:55vh;min-height:360px}.screen{position:fixed;inset:0;background:#fff;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(360px,100%);text-align:center}.card h1{font-size:22px}.input{width:100%;padding:13px;border:1px solid #bbb;border-radius:8px;font-size:18px;text-align:center;margin:8px 0 12px}button{border:0;border-radius:8px;padding:13px 15px;font-size:16px;background:#1967d2;color:#fff;cursor:pointer}.wide{width:100%;margin-top:8px}.green{background:#188038}.orange{background:#f9ab00;color:#202124}.gray{background:#eee;color:#202124}.role{display:block;width:100%;margin:12px 0;padding:18px;font-size:18px}.toolbar{position:absolute;top:10px;right:10px;z-index:5;display:flex;gap:6px}.room{background:#fff;color:#202124;border:1px solid #ccc;padding:9px 12px;box-shadow:0 1px 4px #0003}.panel{padding:10px 14px}.status{font-size:14px;min-height:22px;color:#555}.nav{display:flex;gap:8px}.nav button{flex:1}.error{color:#c5221f;min-height:20px;font-size:14px}.modal{position:fixed;inset:0;background:#0006;z-index:30;display:none;align-items:center;justify-content:center}.modalbox{background:#fff;border-radius:12px;padding:18px;width:min(330px,calc(100% - 40px))}.steps{max-height:180px;overflow:auto;margin-top:8px;font-size:14px}.step{padding:7px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div id="passwordScreen" class="screen"><div class="card"><h1>接送導航</h1><p>請輸入密碼</p><input id="passwordInput" class="input" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><div id="passwordError" class="error"></div><button id="passwordBtn" class="wide">進入</button></div></div>
<div id="roleScreen" class="screen" style="display:none"><div class="card"><h1>選擇身份</h1><button id="driverBtn" class="role">🚗 我係司機</button><button id="passengerBtn" class="role green">🧍 我係乘客</button><p>預設房號：0001</p></div></div>
<div class="toolbar"><button id="roomBtn" class="room" style="display:none">房號 <span id="roomText">0001</span> ▾</button></div>
<div id="map"></div>
<div class="panel"><div id="status" class="status">請先輸入密碼</div><div class="nav"><button id="navigateBtn" style="display:none">🧭 開 Google Maps 導航</button><button id="arrivalBtn" class="green" style="display:none">📍 到達等候點</button></div><div id="steps" class="steps"></div></div>
<div id="roomModal" class="modal"><div class="modalbox"><h3>轉房／開新房</h3><input id="roomInput" class="input" placeholder="例如 0002" maxlength="20"><button id="joinBtn" class="wide">確認轉房</button><button id="newBtn" class="wide orange">開新房</button><button id="closeBtn" class="wide gray">取消</button></div></div>
<script>
const APP_PASSWORD="0813";
const FIREBASE_CONFIG={apiKey:"AIzaSyAeeZza00rqU7rMhCS2rDxgDDDKbRdR144",authDomain:"pickup-tracker-5032f.firebaseapp.com",databaseURL:"https://pickup-tracker-5032f-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"pickup-tracker-5032f",storageBucket:"pickup-tracker-5032f.firebasestorage.app",messagingSenderId:"116867625005",appId:"1:116867625005:web:471c15c1913d1dce8688a4"};
const GOOGLE_MAPS_API_KEY="AIzaSyAyMo3Bbf0Rg5EYkTUQ539V_cbNUO_FFcg";
const DEFAULT_ROOM="0001",MOVE_METERS=10;
let role=null,room=localStorage.getItem("pickupRoom")||DEFAULT_ROOM,map,db,watchId,driverPos=null,lastSent=null,arrived=false,passengerMarker,driverMarker,directionsService,directionsRenderer,lastPassenger=null,routeRequestId=0;
const $=id=>document.getElementById(id),status=$('status');
function load(src){return new Promise((ok,no)=>{let s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('載入 SDK 失敗'));document.head.appendChild(s)})}
function dist(a,b){let R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng),q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function setStatus(t){status.textContent=t}
function setRoom(n){room=(n||DEFAULT_ROOM).trim();localStorage.setItem('pickupRoom',room);$('roomText').textContent=room;if(db)listenRoom()}
function currentLocation(){return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),reject,{enableHighAccuracy:true,timeout:15000,maximumAge:2000})})}
async function start(r){role=r;$('roleScreen').style.display='none';$('roomBtn').style.display='block';try{if(!db){await load('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');await load('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js');firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database()}if(!map){await load(`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&libraries=geometry`);map=new google.maps.Map($('map'),{center:{lat:22.3193,lng:114.1694},zoom:14,mapTypeControl:false,streetViewControl:false,fullscreenControl:true});directionsService=new google.maps.DirectionsService();directionsRenderer=new google.maps.DirectionsRenderer({map,preserveViewport:false,suppressMarkers:false});}listenRoom();role==='passenger'?startPassenger():startDriver()}catch(e){setStatus('初始化失敗：'+e.message)}}
function listenRoom(){if(window.roomRef)window.roomRef.off();window.roomRef=db.ref(`rides/${room}/passengerLocation`);$('roomText').textContent=room;if(role==='driver')window.roomRef.on('value',onPassengerData)}
function startPassenger(){ $('arrivalBtn').style.display='block';setStatus('乘客模式：請允許定位');if(passengerMarker)passengerMarker.setMap(null);passengerMarker=new google.maps.Marker({map,label:'你'});if(watchId)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>{let x={lat:p.coords.latitude,lng:p.coords.longitude};map.setCenter(x);passengerMarker.setPosition(x);uploadIfNeeded(x,false)},e=>setStatus('乘客定位失敗：'+e.message),{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}
function uploadIfNeeded(x,force){let moved=lastSent?dist(lastSent,x):Infinity;if(force||moved>=MOVE_METERS){lastSent=x;window.roomRef.set({lat:x.lat,lng:x.lng,arrived:force||arrived,updatedAt:Date.now()});setStatus(force?'✅ 已通知司機你到達等候點':`位置已更新（${moved===Infinity?'首次':moved.toFixed(1)+' 米'}）`)}}
async function startDriver(){ $('navigateBtn').style.display='block';setStatus('司機模式：請允許定位，等待乘客位置');if(driverMarker)driverMarker.setMap(null);driverMarker=new google.maps.Marker({map,label:'車'});if(watchId)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>{driverPos={lat:p.coords.latitude,lng:p.coords.longitude};driverMarker.setPosition(driverPos)},e=>setStatus('司機定位失敗：'+e.message),{enableHighAccuracy:true,maximumAge:3000,timeout:15000})}
function onPassengerData(s){let d=s.val();if(!d)return;lastPassenger={lat:Number(d.lat),lng:Number(d.lng)};setStatus((d.arrived?'🔴 乘客已到達等候點':'🟡 乘客位置已更新')+' · 房號 '+room);$('navigateBtn').style.display='block';if(driverPos)drawRoute(driverPos,lastPassenger,d)}
function drawRoute(origin,destination,data){let id=++routeRequestId;directionsService.route({origin,destination,travelMode:google.maps.TravelMode.DRIVING,provideRouteAlternatives:false},(result,st)=>{if(id!==routeRequestId)return;if(st==='OK'&&result){directionsRenderer.setDirections(result);let leg=result.routes[0]?.legs[0];$('steps').innerHTML=leg?leg.steps.map((x,i)=>`<div class="step">${i+1}. ${x.instructions}（${x.distance.text}）</div>`).join(''):'';setStatus((data.arrived?'🔴 乘客已到達等候點':'🟡 路線已更新')+' · '+(leg?leg.duration.text:''))}else setStatus('路線暫時無法計算：'+st+'；可撳上方按鈕用 Google Maps 導航')})}
function openNavigation(){if(!lastPassenger){setStatus('尚未收到乘客位置');return}let u='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(`${lastPassenger.lat},${lastPassenger.lng}`)+'&travelmode=driving&dir_action=navigate';window.location.href=u}
function unlock(){sessionStorage.setItem('pickupUnlocked','1');$('passwordScreen').style.display='none';$('roleScreen').style.display='flex'}
function checkPass(){if($('passwordInput').value===APP_PASSWORD)unlock();else{$('passwordError').textContent='密碼不正確';$('passwordInput').select()}}
$('passwordBtn').onclick=checkPass;$('passwordInput').onkeydown=e=>{if(e.key==='Enter')checkPass()};if(sessionStorage.getItem('pickupUnlocked')==='1')unlock();$('driverBtn').onclick=()=>start('driver');$('passengerBtn').onclick=()=>start('passenger');$('arrivalBtn').onclick=async()=>{try{arrived=true;let x=await currentLocation();uploadIfNeeded(x,true)}catch(e){setStatus('無法取得目前位置：'+e.message)}};$('navigateBtn').onclick=openNavigation;
$('roomBtn').onclick=()=>{$('roomInput').value=room;$('roomModal').style.display='flex'};$('closeBtn').onclick=()=>$('roomModal').style.display='none';$('joinBtn').onclick=()=>{setRoom($('roomInput').value);$('roomModal').style.display='none'};$('newBtn').onclick=()=>{setRoom(String(Math.floor(1000+Math.random()*9000)));$('roomModal').style.display='none'};
</script>
</body>
</html>
